<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messaging – BluKaam Connection</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#0D2F6E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="social.css">
</head>

<body style="background: var(--off-white);">

  <nav>
    <div class="nav-inner">
      <a class="logo-wrap" href="index.html">
        <img class="logo-icon-img" src="logo-emblem.png" alt="BluKaam Logo">
        <div class="logo-text"><div class="brand">BluKaam</div><div class="sub">Connection</div></div>
      </a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="jobs.html">Find Jobs</a>
        <a href="workers.html">Browse Workers</a>
        <a href="training.html">Training</a>
      </div>
      <button class="hamburger" onclick="toggleMenu()" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
  </nav>
  <div class="mobile-menu" id="mobileMenu">
    <a href="index.html">Home</a><a href="jobs.html">Find Jobs</a><a href="workers.html">Browse Workers</a>
    <a href="training.html">Training</a><a href="feed.html">Feed</a><a href="network.html">My Network</a><a href="messages.html">Messaging</a>
  </div>

  <main class="chat-layout">
    <div class="chat-list" id="chatList">Loading conversations...</div>
    <div class="chat-thread-panel">
      <div id="chatEmptyState" class="chat-empty-state">Select a connection to start messaging.</div>
      <div id="chatActiveThread" style="display:none; height:100%; display:flex; flex-direction:column;">
        <div class="chat-thread-header" id="chatThreadHeader"></div>
        <div class="chat-thread-messages" id="chatThreadMessages"></div>
        <div class="chat-input-row">
          <input type="text" id="chatInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendChatMessage()">
          <button class="btn-post" onclick="sendChatMessage()">Send</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Supabase Cloud Authentication SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth-profile.js"></script>
  <script src="social-sdk.js"></script>
  <script src="messages.js"></script>
</body>
</html>
