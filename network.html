<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Network – BluKaam Connection</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#0D2F6E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="social.css">
</head>

<body style="background: var(--off-white);">

  <nav>
    <div class="nav-inner">
      <a class="logo-wrap" href="index.html">
        <img class="logo-icon-img" src="logo-emblem.png" alt="BluKaam Logo">
        <div class="logo-text"><div class="brand">BluKaam</div><div class="sub">Connection</div></div>
      </a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="jobs.html">Find Jobs</a>
        <a href="workers.html">Browse Workers</a>
        <a href="training.html">Training</a>
      </div>
      <button class="hamburger" onclick="toggleMenu()" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
  </nav>
  <div class="mobile-menu" id="mobileMenu">
    <a href="index.html">Home</a><a href="jobs.html">Find Jobs</a><a href="workers.html">Browse Workers</a>
    <a href="training.html">Training</a><a href="feed.html">Feed</a><a href="network.html">My Network</a><a href="messages.html">Messaging</a>
  </div>

  <main style="max-width:1000px; margin: 30px auto 60px; padding: 0 1.5rem;">
    <h1 style="font-family:var(--font-heading); font-size:26px; font-weight:800; color:var(--gray-800); margin-bottom:4px;">My Network</h1>
    <p style="color:var(--gray-500); margin-bottom:20px;">Manage your connections, invitations and discover people you may know.</p>

    <div class="tab-row">
      <button class="tab-btn active" data-tab="connections" onclick="switchTab('connections')">My Connections</button>
      <button class="tab-btn" data-tab="pending" onclick="switchTab('pending')">Invitations Received</button>
      <button class="tab-btn" data-tab="sent" onclick="switchTab('sent')">Sent Invitations</button>
      <button class="tab-btn" data-tab="suggestions" onclick="switchTab('suggestions')">People You May Know</button>
    </div>

    <div id="tab-connections" class="tab-panel"><div class="network-grid" id="connectionsGrid">Loading...</div></div>
    <div id="tab-pending" class="tab-panel" style="display:none;"><div class="network-grid" id="pendingGrid">Loading...</div></div>
    <div id="tab-sent" class="tab-panel" style="display:none;"><div class="network-grid" id="sentGrid">Loading...</div></div>
    <div id="tab-suggestions" class="tab-panel" style="display:none;"><div class="network-grid" id="suggestionsGrid">Loading...</div></div>
  </main>

  <!-- Supabase Cloud Authentication SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth-profile.js"></script>
  <script src="social-sdk.js"></script>
  <script src="network.js"></script>
</body>
</html>
